[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accurate-mcp"
version = "0.1.0"
description = "MCP server for Accurate Online Open API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
accurate-mcp = "accurate_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["accurate_mcp"]
